name: Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv and dependencies
      uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      with:
        enable-cache: true
    - name: Sync dependencies
      run: uv sync --frozen

    - name: Run Static Analysis (Pyright)
      run: |
        uv run pyright

    - name: Run Linting (Ruff)
      run: |
        uv run ruff check --output-format=github
        uv run ruff format --check

    - name: Run Security Scan (Bandit)
      run: |
        uv run bandit -r argus -f json -o bandit-report.json || true
        uv run bandit -r argus

    - name: Run Tests with Coverage
      run: |
        uv run pytest --cov=argus --cov-report=xml --cov-report=html --cov-fail-under=80

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Run Quality Gates
      run: |
        python -m argus.core.quality.cli run \
          --output=quality-report.json \
          --format=json \
          --fail-on-warning

    - name: Upload Quality Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: quality-report
        path: |
          quality-report.json
          bandit-report.json
          coverage.xml
          htmlcov/

    - name: Comment PR with Quality Report
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('quality-report.json', 'utf8'));
            const summary = report.summary;
            
            let comment = `## 🔍 Quality Gate Report\n\n`;
            comment += `**Overall Status:** ${summary.success ? '✅ PASSED' : '❌ FAILED'}\n`;
            comment += `**Pass Rate:** ${summary.pass_rate.toFixed(1)}%\n`;
            comment += `**Duration:** ${summary.duration.toFixed(2)}s\n\n`;
            
            comment += `| Gate | Status | Message |\n`;
            comment += `|------|--------|----------|\n`;
            
            for (const result of report.results) {
              const status = result.status === 'passed' ? '✅' : '❌';
              comment += `| ${result.gate_name} | ${status} | ${result.message} |\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not generate quality report comment:', error);
          }

  performance-gates:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      with:
        enable-cache: true
    - name: Sync dependencies
      run: |
        uv sync --frozen
        uv pip install psutil

    - name: Run Performance Gates
      run: |
        python -m argus.core.quality.cli run \
          --gates=performance \
          --output=performance-report.json \
          --format=json

    - name: Upload Performance Report
      uses: actions/upload-artifact@v4
      with:
        name: performance-report
        path: performance-report.json
